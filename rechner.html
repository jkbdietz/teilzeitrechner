<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teilzeit-Brutto-Rechner (IT-KV)</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--text:#2b2118;--muted:#8a7767;--accent:#f97316;--line:#f1dcc8;--res:#ffedd9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
main{max-width:480px;margin:0 auto}
h1{font-size:1.3rem;margin:8px 0 16px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;border:0;background:transparent;color:var(--text);font-size:1.4rem;padding:12px 0;outline:none;width:100%}
.inp span{color:var(--muted);font-size:1.2rem}
.hours{display:flex;justify-content:space-between;align-items:baseline}
.hours strong{font-size:1.6rem}
input[type=range]{width:100%;accent-color:var(--accent);margin:14px 0 4px;height:32px}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.res{background:var(--res)}
.big{font-size:2rem;font-weight:700;color:var(--accent);margin:4px 0}
.small{font-size:.8rem;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<main>
<h1>Teilzeit-Brutto-Rechner</h1>

<div class="card">
<label for="gross">Brutto-Monatsgehalt Vollzeit (38,5 h)</label>
<div class="inp"><input id="gross" type="text" inputmode="decimal" placeholder="z. B. 3.500" autocomplete="off"><span>€</span></div>
</div>

<div class="card">
<div class="hours"><label for="h" style="margin:0">Wochenstunden</label><strong id="hv">38,5 h</strong></div>
<input id="h" type="range" min="10" max="38.5" step="0.5" value="38.5">
<div class="scale"><span>10 h</span><span>38,5 h</span></div>
</div>

<div class="card res">
<label>Teilzeit-Brutto pro Monat</label>
<div class="big" id="out">–</div>
<div class="small" id="pct">Beschäftigungsausmaß: 100 %</div>
</div>

<p class="small">Berechnung: Vollzeit-Brutto × Wochenstunden ÷ 38,5 (wöchentliche Normalarbeitszeit laut IT-KV). Unverbindliche Orientierung; Zulagen, Überzahlung und Sonderzahlungen sind nicht gesondert berücksichtigt.</p>
</main>
<script>
var FT=38.5,g=document.getElementById('gross'),h=document.getElementById('h');
var fmt=new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'});
var nf=new Intl.NumberFormat('de-AT',{maximumFractionDigits:1});
function parse(s){s=s.replace(/[€\s]/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
function calc(){
var hrs=parseFloat(h.value);
document.getElementById('hv').textContent=nf.format(hrs)+' h';
document.getElementById('pct').textContent='Beschäftigungsausmaß: '+nf.format(hrs/FT*100)+' %';
var v=parse(g.value);
document.getElementById('out').textContent=isNaN(v)?'–':fmt.format(Math.round(v*hrs/FT*100)/100);
}
g.addEventListener('input',calc);h.addEventListener('input',calc);calc();
</script>
</body>
</html>
